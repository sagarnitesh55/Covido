      <script>
              
        const questions = [
          { key: 'name', text: 'Please enter your name:' },
          { key: 'age', text: 'Please enter your age:', isNumber: true },
          { key: 'sick', text: 'Are you feeling sick? (yes/no)', valid: ['yes', 'no'] },
          { key: 'symptom', text: 'Are you feeling cold or fever? (cold/fever/yes/no)', valid: ['yes', 'no', 'cold', 'fever'] }
        ];


        let state = {
          index: 0,
          data: {},
          result: '',
          mode: 'main',          // main | followup | done
          followupHandler: null
        };

        function startCheckup() {
          
          state.index = 0;
          state.data = {};
          state.result = '';
          state.mode = 'main';
          state.followupHandler = null;

          document.getElementById('result').style.display = "none";
          document.getElementById('result').innerText = '';
          document.getElementById('question-container').style.display = 'block';

          showQuestion();
        }

        function showQuestion(text = null) {
          
          const question = text || questions[state.index]?.text;
          document.getElementById('question').innerText = question;
          const input = document.getElementById('userInput');
          input.value = '';
          input.focus();
        }

        function capitalizeFirstLetter(str) {
          
          if (typeof str !== 'string' || str.length === 0) {
            return str; // Handle non-string input or empty strings
          }

          return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function submitAnswer() {
          
          const input = document.getElementById('userInput').value.trim();
          if (!input) return;

          if (state.mode == 'main') {
            const currentQ = questions[state.index];
            if (!currentQ) return;

            let normalizedInput = input.toLowerCase();

            if (currentQ.valid && !currentQ.valid.includes(normalizedInput)) {
              alert('Please enter: ' + currentQ.valid.join(' / '));
              return;
            }
            if (currentQ.isNumber && (isNaN(parseInt(normalizedInput)) || parseInt(normalizedInput) <= 0 || parseInt(normalizedInput) > 150)) {
              alert('Please enter a valid age.');
              return;
            }

            if(currentQ.key == 'name' && (normalizedInput == 'yes' || normalizedInput == 'no' || (!isNaN(normalizedInput)))){
              alert('Please enter your correct name!');
              return;
            }

            // if(currentQ.key == 'name' && (!isNaN(normalizedInput))){
            //   alert('Please enter your correct name!');
            //   return;
            // }

            const value = currentQ.isNumber
              ? parseInt(normalizedInput)
              : (currentQ.key == 'name' ? input.split(" ")[0] : normalizedInput);

            state.data[currentQ.key] = value;
            state.index++;

            //var csch = questions[state.index];
      
            if (state.index >= questions.length || (currentQ.valid && normalizedInput == 'no') ) {
              state.mode = 'followup';
              askFollowUps();
            } else {
              showQuestion();
            }

          } else if (state.mode == 'followup' && typeof state.followupHandler == 'function') {
            state.followupHandler(input.toLowerCase());
          }
        }

          // handle Enter key
          document.getElementById('userInput').addEventListener('keypress', function(event) {
            if (event.key == 'Enter') {
              event.preventDefault();
              submitAnswer();
            }
          });

          function startVoiceInput() {
            if (!('webkitSpeechRecognition' in window)) {
              alert('Speech recognition is not supported in this browser.');
              return;
            }

            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.start();

            recognition.onresult = function(event) {
              const transcript = event.results[0][0].transcript;
              document.getElementById('userInput').value = transcript;
              submitAnswer(); // auto-submit
            };

            recognition.onerror = function(event) {
              alert('Error occurred in speech recognition: ' + event.error);
            };
          }

          function askFollowUps() {
            
            let name = state.data.name;
       
            name = capitalizeFirstLetter(name);
         
            const symptom = state.data.symptom;

            // ✅ FIX: If user said "no" to being sick → stop immediately
            //alert('HIIII ' + state.data.sick);
            if (state.data.sick == 'no') 
            {
              state.result = `Very good! Stay healthy ${name}. Thanks for using the service!`;
              return done();
            }
            // else
            // {// Otherwise follow-up logic
              if (symptom == 'fever') {
                ask("Did you travel overseas recently? (yes/no)", ['yes','no'], (overseas) => {
                  if (overseas == 'yes') {
                    ask("Were you quarantined after returning? (yes/no)", ['yes','no'], (quarantine) => {
                      state.result = (quarantine == 'yes')
                        ? `Hey ${name}, no need to worry! Take proper rest and medicines.`
                        : `${name}, please consult a COVID health center for a check-up.`;
                      done();
                    });
                  } else {
                    ask("Were you in contact with a COVID patient? (yes/no)", ['yes','no'], (contact) => {
                      state.result = (contact == 'yes')
                        ? `${name}, please consult a COVID health center for a check-up.`
                        : `Hey ${name}, no need to worry! Take proper rest and medicines.`;
                      done();
                    });
                  }
                });

              } else if (symptom == 'cold') {
                ask("Did you travel overseas recently? (yes/no)", ['yes','no'], (overseas) => {
                  if (overseas == 'yes') {
                    state.result = `${name}, please get checked at a COVID health center and take rest.`;
                    done();
                  } else {
                    ask("Are you feeling only cold? (yes/no)", ['yes','no'], (onlyCold) => {
                      if (onlyCold == 'yes') {
                        state.result = `${name}, no worry! consult a doctor nearby and take medicine.`;
                        done();
                      } else {
                        ask("Were you in contact with a COVID patient? (yes/no)", ['yes','no'], (contact) => {
                          state.result = (contact == 'yes')
                            ? `${name}, please consult a COVID health center for a check-up.`
                            : `Hey ${name}, no need to worry! Take proper rest and medicines.`;
                          done();
                        });
                      }
                    });
                  }
                });

              } else if (symptom == 'yes') {
                ask("Are you feeling fever? (yes/no)", ['yes','no'], (hasFever) => {
                  if (hasFever == 'yes') {
                    state.data.symptom = 'fever';
                    askFollowUps();
                  } else {
                    ask("Are you feeling cold? (yes/no)", ['yes','no'], (hasCold) => {
                      if (hasCold == 'yes') {
                        state.data.symptom = 'cold';
                        askFollowUps();
                      } else {
                        state.result = `Great! Enjoy your health ${name}, you don't need to worry.`;
                        done();
                      }
                    });
                  }
                });

              } else {
                ask("Are you feeling headache? (yes/no)", ['yes','no'], (headache) => {
                  if (headache == 'yes') {
                    ask("Did you travel overseas in the last 2 weeks? (yes/no)", ['yes','no'], (travel) => {
                      if (travel == 'yes') {
                        ask("Were you quarantined after returning? (yes/no)", ['yes','no'], (quarantine) => {
                          state.result = (quarantine == 'yes')
                            ? `Hey ${name}, no need to worry! Rest and take medicines.`
                            : `${name}, please consult a COVID health center for a check-up.`;
                          done();
                        });
                      } else {
                        state.result = `${name}, don't worry. Just visit a doctor and take medicine.`;
                        done();
                      }
                    });
                  } else {
                    state.result = `Very good! Stay healthy ${name}. Thanks for using the service!`;
                    done();
                  }
                });
              }
            //}

          }

          function ask(msg, valid, cb) {
            document.getElementById('question').innerText = msg;
            document.getElementById('userInput').value = '';
            document.getElementById('userInput').focus();

            state.followupHandler = function(input) {
              if (!valid.includes(input)) {
                alert('Please enter: ' + valid.join(' / '));
                return;
              }
              cb(input);
            };
          }

          function done() {
            document.getElementById('question-container').style.display = 'none';
            const res = document.getElementById('result');
            res.style.display = "block";
            res.innerText = state.result;
            state.mode = "done";        // ✅ prevents further input
            state.followupHandler = null;
          }

      </script>
